[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clauseanchor"
version = "0.1.0"
description = "把政策公报拆成带页码与字符位置的条款树，并把每条结论钉回原文引文。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SuperMarioYL" }]
keywords = ["policy", "clause", "citation", "gongbao", "chinese"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pymupdf>=1.24,<2",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
]

[project.scripts]
clauseanchor = "clauseanchor.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/clauseanchor"
Repository = "https://github.com/SuperMarioYL/clauseanchor"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/clauseanchor"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "clauseanchor/templates"
"examples/sample_gongbao.txt" = "clauseanchor/examples/sample_gongbao.txt"

[tool.hatch.build.targets.sdist]
include = [
    "/src/clauseanchor",
    "/templates",
    "/examples",
    "/tests",
    "/SKILL.md",
    "/README.md",
    "/README.en.md",
    "/CHANGELOG.md",
    "/VERSION",
    "/LICENSE",
    "/.github/workflows/ci.yml",
]
